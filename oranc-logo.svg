      C179 72 176 91 163 99
      C169 115 158 130 142 130
      C135 145 116 148 103 136
      L103 118
      C116 112 118 99 109 90
      C120 78 117 62 103 56 Z"/>
    <path class="gray" d="M97 34 V127"/>
